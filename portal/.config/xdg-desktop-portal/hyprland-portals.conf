# Portal routing for the Hyprland session. Read before ~/.config/xdg-desktop-portal/portals.conf.
[preferred]
default=hyprland;gtk
# Screenshare/screenshots go through xdg-desktop-portal-hyprland
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland
# File pickers
org.freedesktop.impl.portal.FileChooser=gtk
# System dark mode: org.freedesktop.appearance color-scheme = prefer-dark.
# xdg-desktop-portal-gtk serves it from the gsettings keys set by darkmode.sh;
# browsers (Brave/Chromium "Device" theme, Firefox), Electron, GTK4/libadwaita
# and Qt 6 all read it from here.
org.freedesktop.impl.portal.Settings=gtk
