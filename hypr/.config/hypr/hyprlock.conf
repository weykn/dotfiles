# Replaces: i3lock -c 000000  (blue themed, blurred wallpaper)

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = ~/.local/share/wallpapers/current
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.15
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgba(240, 244, 250, 1.0)
    font_size = 92
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(163, 170, 181, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(110, 168, 222, 1.0)
    inner_color = rgba(27, 30, 34, 0.85)
    font_color  = rgba(240, 244, 250, 1.0)
    check_color = rgba(143, 208, 232, 1.0)
    fail_color  = rgba(208, 84, 110, 1.0)

    fade_on_empty = false
    rounding = 10
    placeholder_text = <span foreground="##a3aab5">password</span>
    fail_text = <span foreground="##d0546e">$FAIL ($ATTEMPTS)</span>

    position = 0, -40
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =   $USER
    color = rgba(110, 168, 222, 1.0)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}
