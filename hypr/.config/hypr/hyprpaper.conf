# Wallpaper daemon.
#
# hyprpaper 0.8 dropped the old `preload =` / `wallpaper = MON,path` syntax in
# favour of `wallpaper { }` blocks; the old keys are now hard parse errors that
# leave every monitor blank.
#
# The path below is a symlink managed by ~/.config/scripts/setbg.sh — the
# config itself never changes, so setting a wallpaper never dirties this repo.
# hyprpaper canonicalises the link at startup and sniffs the real file with
# libmagic, so the link needs no extension and may point at any format.

splash = false
ipc = on

wallpaper {
    monitor  =
    path     = ~/.local/share/wallpapers/current
    fit_mode = cover
}
