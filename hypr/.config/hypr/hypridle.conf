# Replaces: xss-lock --transfer-sleep-lock -- i3lock --nofork
#
# NOTE: this config is Lua, so `hyprctl dispatch` takes a Lua dispatcher, not
# the old `dpms off` word form — that parses as a toggle and silently flips the
# monitors instead of setting a state. The key is `action`, not `state`.
# Faithful to your i3 setup: it locks before sleep, it does NOT auto-lock on idle.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}

# Blank the screens after 15 min of idle (no lock).
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}

# Want auto-lock like most Wayland setups? Uncomment this block:
# listener {
#     timeout = 600
#     on-timeout = loginctl lock-session
# }
