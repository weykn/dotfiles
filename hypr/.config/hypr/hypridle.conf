# Replaces: xss-lock --transfer-sleep-lock -- i3lock --nofork
# Faithful to your i3 setup: it locks before sleep, it does NOT auto-lock on idle.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Blank the screens after 15 min of idle (no lock).
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Want auto-lock like most Wayland setups? Uncomment this block:
# listener {
#     timeout = 600
#     on-timeout = loginctl lock-session
# }
