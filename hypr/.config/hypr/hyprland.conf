# ============================================================
#  Hyprland — ported 1:1 from ~/.config/i3/config
#  Blue palette. Terminal: foot. Launcher: fuzzel. Bar: waybar.
# ============================================================

# SUPER = Mod4 in i3
$mod = SUPER
$terminal = foot
$scripts = ~/.config/hypr/scripts

# ---------- Blue palette ----------
# (hue-shifted version of the i3 purple set)
$bg        = 0xff1b1e22
$bgAlt     = 0xff262b33
$unfocused = 0xff3a3c44
$inactive  = 0xff5d6b7a
$accent    = 0xff6ea8de
$accent2   = 0xff8fd0e8
$urgent    = 0xffd0546e
$fg        = 0xfff0f4fa

# ---------- Monitors ----------
# i3: xrandr --output HDMI-2 --auto --primary --output HDMI-1 --auto --right-of HDMI-2
monitor = HDMI-A-2, 1920x1080@144, 0x0, 1
monitor = HDMI-A-1, 2560x1440@144, 1920x0, 1
# fallback for anything else plugged in
monitor = , preferred, auto, 1

# ---------- Environment ----------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = _JAVA_AWT_WM_NONREPARENTING,1

# ---------- Autostart (from i3 exec_always) ----------
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = udiskie --tray
exec-once = thunar --daemon
# nm-applet / dex are NOT installed on this machine — the equivalent lines in your
# i3 config have been failing silently. Left off on purpose; uncomment if you install them.
# exec-once = nm-applet --indicator
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle
# clipmenud -> cliphist
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# exec-once = dex --autostart --environment Hyprland
# NOTE: picom is not needed (blur is built in), feh is replaced by hyprpaper,
#       autotile.py is replaced by the dwindle layout below.

# ---------- Look & feel ----------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $accent $accent2 45deg
    col.inactive_border = $unfocused
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.97

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = 0x66000000
    }
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    bezier = snap,   0.2,  1.0, 0.2, 1.0

    animation = windows,     1, 4, smooth, popin 90%
    animation = windowsOut,  1, 4, smooth, popin 90%
    animation = border,      1, 8, smooth
    animation = fade,        1, 4, smooth
    animation = workspaces,  1, 4, snap, slide
    animation = specialWorkspace, 1, 4, snap, slidevert
}

dwindle {
    # replaces autotile.py: splits follow window aspect ratio automatically
    preserve_split = false
    smart_split = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

cursor {
    no_hardware_cursors = false
}

# ---------- Input ----------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
}

# ---------- Window rules ----------
# 0.56 syntax: keyed blocks, `name` must come first.

windowrule {
    name = float-dialogs
    match {
        class = ^(pavucontrol|nm-connection-editor|blueman-manager|udiskie|xdg-desktop-portal-gtk)$
    }
    float = true
}

windowrule {
    name = pip
    match {
        title = ^(Picture-in-Picture)$
    }
    float = true
    pin = true
}

windowrule {
    name = no-maximize-requests
    match {
        class = .*
    }
    suppress_event = maximize
}

# ---------- Layer rules (blur the bar, launcher and notifications) ----------
layerrule {
    name = blur-waybar
    match {
        namespace = waybar
    }
    blur = true
    # bar background is transparent — only blur behind the opaque islands
    ignore_alpha = 0.35
}

layerrule {
    name = blur-launcher
    match {
        namespace = launcher
    }
    blur = true
    ignore_alpha = 0.0
}

layerrule {
    name = blur-notifications
    match {
        namespace = notifications
    }
    blur = true
}

# ============================================================
#                        KEYBINDS
#            (identical to your i3 config)
# ============================================================

# --- i3 shortcuts block ---
bind = $mod, V,      exec, $scripts/clipboard.sh      # was: clipmenu
bind = $mod, period, exec, $scripts/emoji.sh          # was: rofi -show emoji
bind = $mod, S,      exec, $scripts/screenshot.sh     # was: flameshot gui
bind = $mod, E,      exec, hyprlock                   # was: i3lock -c 000000
bind = $mod, C,      exec, $scripts/calc.sh           # rofi calc, themed to match fuzzel
bind = $mod, P,      exec, $scripts/power.sh

# scratchpad
bind = $mod, minus,  movetoworkspacesilent, special:scratch
bind = $mod, Y,      togglespecialworkspace, scratch

# was: split h  (dwindle equivalent)
bind = $mod, U,      layoutmsg, togglesplit

# --- core ---
bind = $mod, Return, exec, $terminal
bind = $mod, Q,      killactive,
bind = $mod, D,      exec, fuzzel                    # app launcher
bind = $mod, F,      fullscreen, 0
bind = $mod, N,      togglefloating,

# --- focus (hjkl + arrows) ---
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left,  movefocus, l
bind = $mod, down,  movefocus, d
bind = $mod, up,    movefocus, u
bind = $mod, right, movefocus, r

# --- move window ---
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, down,  movewindow, d
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, right, movewindow, r

# --- workspaces 1-10 ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# --- move container to workspace (does not follow, like i3) ---
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

# --- session ---
bind = $mod SHIFT, R, exec, hyprctl reload            # was: restart i3
bind = $mod SHIFT, E, exec, $scripts/exit.sh          # was: i3-nagbar exit

# --- floating_modifier $mod ---
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- audio (pactl, same as i3) ---
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bindl  = , XF86AudioMute,        exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# ============================================================
#  resize submap — same odd l/i/k/j layout as your i3 mode
# ============================================================
bind = $mod, R, submap, resize
submap = resize

# l = shrink width, j = grow width, i = grow height, k = shrink height
binde = , L, resizeactive, -10 0
binde = , J, resizeactive,  10 0
binde = , I, resizeactive,  0 10
binde = , K, resizeactive,  0 -10

# arrows: Right shrink width, Left grow width, Up grow height, Down shrink height
binde = , right, resizeactive, -10 0
binde = , left,  resizeactive,  10 0
binde = , up,    resizeactive,  0 10
binde = , down,  resizeactive,  0 -10

bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $mod, R,  submap, reset
submap = reset
