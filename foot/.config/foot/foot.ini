# foot — blue theme. Font size matches your kitty.conf (16).
[main]
# Explicit so foot never depends on an inherited $SHELL — a session started
# before `chsh` would otherwise keep launching the old shell until relogin.
shell=/usr/bin/zsh
font=JetBrainsMono Nerd Font:size=16
font-bold=JetBrainsMono Nerd Font:style=Bold:size=16
font-italic=JetBrainsMono Nerd Font:style=Italic:size=16
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=16
pad=10x10 center
dpi-aware=no

[cursor]
style=beam
blink=yes

[scrollback]
lines=10000
multiplier=3.0

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.92
background=1b1e22
foreground=f0f4fa

cursor=1b1e22 6ea8de

selection-foreground=f0f4fa
selection-background=3b5a7a

urls=6ea8de

## normal
regular0=2a2e38
regular1=d0546e
regular2=8bc48a
regular3=e0c187
regular4=6ea8de
regular5=a98fd0
regular6=8fd0e8
regular7=c9d1dc

## bright
bright0=3a4250
bright1=e06c82
bright2=a3d6a2
bright3=ecd3a0
bright4=8fbdf0
bright5=c0a8e0
bright6=a8e0f2
bright7=f0f4fa

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
