# fuzzel — matches the waybar/hyprland blue palette
# accent #6ea8de · accent2 #8fd0e8 · bg #1b1e22 · fg #f0f4fa

[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt="  "
placeholder=Search applications
icons-enabled=yes
icon-theme=Adwaita
terminal=foot -e
layer=overlay

lines=9
width=48
horizontal-pad=22
vertical-pad=18
inner-pad=14
line-height=30
letter-spacing=0
tabs=4

# name + comment only — matching on filename/keywords/categories
# was what filled the list with junk results
fields=name,generic,comment
match-mode=fzf

[colors]
background=1b1e22f0
text=e8eef7ff
prompt=6ea8deff
placeholder=8f9aa8ff
input=f0f4faff
match=8fd0e8ff
selection=6ea8deff
selection-text=12161bff
selection-match=13324dff
counter=8f9aa8ff
border=6ea8deff

[border]
width=2
radius=14
selection-radius=10

[dmenu]
exit-immediately-if-empty=no

[key-bindings]
cancel=Escape Control+c Control+bracketleft
execute=Return KP_Enter Control+y
prev=Up Control+p
next=Down Control+n
