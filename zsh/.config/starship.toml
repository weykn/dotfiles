# starship — blue, two-line, right-aligned context
# Powerline caps ( ) need a Nerd Font — JetBrainsMono Nerd Font is set in foot.

add_newline = true
command_timeout = 800

format = """
$directory$git_branch$git_status$cmd_duration$status$jobs\
$fill\
$nodejs$python$rust$golang$java$docker_context$time
$character"""

[directory]
format = "[]($style)[ $path$read_only ](bg:#3b5a7a fg:#e8eef7 bold)[]($style)"
style = "fg:#3b5a7a"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
read_only = "  "
home_symbol = "~"

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold #6ea8de)"
error_symbol = "[❯](bold #d0546e)"
vimcmd_symbol = "[❮](bold #8bc48a)"

[git_branch]
symbol = " "
style = "fg:#8fd0e8"
format = "[ $symbol$branch]($style)"

[git_status]
style = "fg:#e0c187"
format = "[ $all_status$ahead_behind]($style)"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2000
style = "fg:#e0c187"
format = "[  $duration]($style)"

[status]
disabled = false
symbol = "✘"
format = "[ $symbol$status]($style)"
style = "fg:#d0546e"

[jobs]
symbol = ""
style = "fg:#8bc48a"
format = "[ $symbol$number]($style)"

[time]
disabled = false
style = "fg:#5d6b7a"
format = "[ $time ]($style)"
time_format = "%H:%M"

[nodejs]
symbol = " "
style = "fg:#8bc48a"
format = "[ $symbol($version)]($style)"

[python]
symbol = " "
style = "fg:#e0c187"
format = "[ $symbol($version)]($style)"

[rust]
symbol = " "
style = "fg:#d0546e"
format = "[ $symbol($version)]($style)"

[golang]
symbol = " "
style = "fg:#8fd0e8"
format = "[ $symbol($version)]($style)"

[java]
symbol = " "
style = "fg:#d0546e"
format = "[ $symbol($version)]($style)"

[docker_context]
symbol = " "
style = "fg:#6ea8de"
format = "[ $symbol$context]($style)"

[package]
disabled = true
